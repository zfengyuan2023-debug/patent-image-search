<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>以图搜外观专利</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>以图搜外观专利</h1></header>
<main>
<div class="panel">
<p class="note">索引、著录和缩略图是加密的。未解锁时页面没有这些内容。加密文件仍可被下载后离线猜密码，正式密码必须长且随机。本页不保存密码。</p>
<form id="gate">
<input id="pw" type="password" autocomplete="current-password" placeholder="密码">
<button type="submit">解锁</button>
<button type="button" id="lock" disabled>锁定</button>
</form>
<p class="note" id="status">尚未解锁。</p>
<input id="file" type="file" accept="image/*" disabled>
<div class="grid" id="grid"></div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/ort.min.js"></script>
<script src="catalog_crypto.js"></script>
<script src="clip_preprocess.js"></script>
<script src="clip_embed.js"></script>
<script src="search.js"></script>
<script src="session.js"></script>
<script>
let session = null;
let clip = null;
const status = document.querySelector("#status");
const file = document.querySelector("#file");

function wipe() {
  session = null;
  document.querySelector("#grid").innerHTML = "";
  file.disabled = true;
  document.querySelector("#lock").disabled = true;
}

document.querySelector("#lock").onclick = function () {
  wipe();
  status.textContent = "已锁定。内存中的索引和图片已丢掉。";
};

async function loadClip() {
  const resp = await fetch("model/manifest.json");
  if (!resp.ok) return null;
  const manifest = await resp.json();
  if (manifest.model !== "ViT-B-32" || manifest.pretrained !== "laion2b_s34b_b79k") {
    throw new Error("查询模型不是现有索引用的 ViT-B-32 laion2b_s34b_b79k");
  }
  const runtime = await ort.InferenceSession.create("model/" + manifest.file, {
    executionProviders: ["wasm"],
  });
  return { runtime: runtime, manifest: manifest };
}

document.querySelector("#gate").onsubmit = async function (ev) {
  ev.preventDefault();
  const password = document.querySelector("#pw").value;
  document.querySelector("#pw").value = "";
  status.textContent = "正在解密…";
  try {
    const headerResp = await fetch("catalog/header.json");
    if (!headerResp.ok) throw new Error("没有加密目录");
    const header = await headerResp.json();
    const fileMap = {};
    for (const ent of header.files) {
      const resp = await fetch("catalog/" + ent.file);
      if (!resp.ok) throw new Error("缺少 " + ent.file);
      fileMap[ent.file] = await resp.arrayBuffer();
    }
    const parts = await PatentCrypto.decryptAll(password, header, fileMap);
    session = PatentSession.openParts(parts);
    document.querySelector("#lock").disabled = false;
    clip = await loadClip();
    if (!clip) {
      file.disabled = true;
      status.textContent = "密码正确，目录已解密（" + session.meta.count + " 条）。同款 CLIP 查询模型不在这个站点里，所以上传检索没有打开。";
      return;
    }
    file.disabled = false;
    status.textContent = "已解锁，可以上传图片。模型 " + clip.manifest.pretrained + "。";
  } catch (err) {
    wipe();
    status.textContent = err.message === "密码不正确" ? "密码不正确，索引和图片没有解开。" : ("打不开目录：" + err.message);
  }
};

file.onchange = async function () {
  const picked = file.files && file.files[0];
  if (!picked || !session || !clip) return;
  status.textContent = "正在计算向量…";
  const bitmap = await createImageBitmap(picked);
  const canvas = document.createElement("canvas");
  canvas.width = bitmap.width;
  canvas.height = bitmap.height;
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(bitmap, 0, 0);
  const rgba = ctx.getImageData(0, 0, bitmap.width, bitmap.height).data;
  const query = await ClipEmbed.embedRGBA(ort, clip.runtime, rgba, bitmap.width, bitmap.height);
  const rows = PatentSession.searchSession(session, query, { region: "ALL", topK: 24 });
  for (const row of rows) {
    const bytes = PatentSession.thumbBytes(session, row);
    if (bytes && bytes.length) row.image_url = URL.createObjectURL(new Blob([bytes], { type: "image/jpeg" }));
  }
  document.querySelector("#grid").innerHTML = PatentSearch.cardsHtml(rows);
  status.textContent = "找到 " + rows.length + " 条。图片来自解密后的缩略图。";
};
</script>
</body>
</html>
